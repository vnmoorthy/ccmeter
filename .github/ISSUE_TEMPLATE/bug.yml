name: Bug report
description: Something doesn't work as expected
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact command + paste of the output (truncate or redact paths).
      render: shell
    validations:
      required: true
  - type: input
    id: ccmeter-version
    attributes:
      label: ccmeter version
      placeholder: "0.1.0 — get it from `ccmeter --version`"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "v20.x or v22.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14 / Ubuntu 22 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: ccmeter doctor output
      description: Paste output of `ccmeter doctor` (redact paths if needed).
      render: shell
